[package]
name = "mimo-herdr"
version = "0.1.0"
edition = "2024"
description = "MiMo Code <-> herdr custom-agent bridge: lifecycle state, crash-proof exit cleanup, one-command spawn"
repository = "https://github.com/ShinoharaHaruna/mimo-code-herdr"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
