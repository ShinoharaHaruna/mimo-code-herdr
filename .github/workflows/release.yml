name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned by commit SHA (tag moved): actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned by commit SHA (branch moved): dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/mimo-herdr-${{ matrix.target }}.tar.gz" -C target/release mimo-herdr
          # Standard "hash  filename" format so both `sha256sum -c` and
          # `shasum -a 256 -c` work. Prefer sha256sum (coreutils) over shasum.
          cd dist
          file="mimo-herdr-${{ matrix.target }}.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$file" > "$file.sha256"
          else
            shasum -a 256 "$file" > "$file.sha256"
          fi
      # Pinned by commit SHA (tag moved): actions/upload-artifact@v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mimo-herdr-${{ matrix.target }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA (tag moved): actions/download-artifact@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mimo-herdr-*
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      # Pinned by commit SHA (tag moved): softprops/action-gh-release@v2
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
